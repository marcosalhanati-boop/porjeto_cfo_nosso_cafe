name: Relatorio Diario CFO Nosso Cafe

on:
  schedule:
    # 11:00 UTC é 08:00 no Horário de Brasília
    - cron: '0 11 * * *'
  workflow_dispatch: 

jobs:
  executar_integracao:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4 # Atualizado para v4

      - name: Instalar Python
        uses: actions/setup-python@v5 # Atualizado para v5
        with:
          python-version: '3.11' # Usando uma versão mais atualizada

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai psycopg2-binary requests python-dotenv holidays

      - name: Rodar Script de Dados e Report
        env:
          SAIPOS_TOKEN: ${{ secrets.SAIPOS_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PWD: ${{ secrets.GMAIL_APP_PWD }}
          DESTINATARIO: ${{ secrets.DESTINATARIO }}
        run: python main.py  # <--- Verifique se o nome aqui é 'main.py' ou 'integracao_saipos.py'
